[env]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git
board = seeed-xiao-esp32-c6
framework = arduino

lib_deps =
    ; MIT
    fastled/FastLED @^3.10.3
    https://github.com/PaulStoffregen/OneWire.git#4f5cd5b4ed0d9f33d25d73a2d906de0e1b10698a

build_flags =
    -std=gnu++20
    -fno-rtti ; needed if we do dynamic_cast or typeid
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

    -Ilib/color/src/color/include
    -DBOARD_HEADER=\"BoardHeader/SEED_XIAO_ESP32_C6.hpp\"

build_src_flags =
    -Wall
    -Wextra
    -Werror


[env:debug]
build_type = debug
monitor_filters = esp32_exception_decoder
monitor_speed = 115200

build_flags =
    ${env.build_flags}
    -fexceptions ; only in debug mode, to get better error messages and stack traces

[env:release]
build_type = release

build_flags =
    ${env.build_flags}
    -fno-exceptions ; assume no exceptions to reduce code size and improve performance